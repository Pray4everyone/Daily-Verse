<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Scripture</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            /* Uses background.jpg from your repository root */
            background: 
                linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)),
                url('background.jpg') center/cover no-repeat fixed;
            background-color: #0d1117;
            color: #f8fafc;
        }

        /* Frosted Glassmorphism Card */
        .card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            padding: 36px 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .tag {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            color: #7dd3fc;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .bg-votd-text {
            font-size: 1.25rem;
            line-height: 1.7;
            color: #ffffff;
            margin-bottom: 16px;
            font-style: italic;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .bg-votd-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fde047;
            margin-bottom: 24px;
            text-shadow: 0 0 10px rgba(253, 224, 71, 0.5);
        }

        .section-divider {
            margin: 24px 0;
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            margin-bottom: 12px;
        }

        .btn-primary:active {
            background: rgba(255, 255, 255, 0.35);
        }

        .btn-music {
            background: rgba(56, 189, 248, 0.25);
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.5);
        }

        .btn-music:active {
            background: rgba(56, 189, 248, 0.4);
        }

        .audio-controls {
            margin-top: 14px;
            display: none;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .audio-controls input[type=range] {
            accent-color: #fde047;
            width: 120px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="tag">✦ Verse of the Day ✦</div>

        <div id="votd-box">
            <div class="bg-votd-text">"Trust in the LORD with all your heart and lean not on your own understanding."</div>
            <div class="bg-votd-title">— Proverbs 3:5</div>
        </div>

        <hr class="section-divider">

        <a id="audio-link" href="https://www.biblegateway.com/audio/mclean/niv/Prov.3" target="_blank" class="btn btn-primary">
            🔊 Listen to Audio Scripture
        </a>

        <button id="music-btn" class="btn btn-music" onclick="toggleMusic()">
            🎵 Play Ambient Music
        </button>

        <div id="audio-controls" class="audio-controls">
            <span style="font-size: 0.8rem; color: #cbd5e1;">Volume:</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" onchange="adjustVolume(this.value)">
        </div>

        <!-- References music.mp3 in your GitHub repository -->
        <audio id="bg-music" loop preload="auto">
            <source src="music.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        function votdCallback(votd) {
            var verseText = votd.text || votd.content;
            var verseRef = votd.reference || votd.display_ref;

            if (verseText && verseRef) {
                document.getElementById('votd-box').innerHTML = 
                    '<div class="bg-votd-text">' + verseText + '</div>' +
                    '<div class="bg-votd-title">— ' + verseRef + '</div>';

                var cleanRef = encodeURIComponent(verseRef);
                document.getElementById('audio-link').href = "https://www.biblegateway.com/passage/?search=" + cleanRef + "&version=NIV";
            }
        }

        var music = document.getElementById("bg-music");
        var musicBtn = document.getElementById("music-btn");
        var controls = document.getElementById("audio-controls");

        function toggleMusic() {
            if (music.paused) {
                music.play().then(function() {
                    musicBtn.innerText = "⏸ Pause Ambient Music";
                    controls.style.display = "flex";
                }).catch(function(e) {
                    alert("Ensure 'music.mp3' is uploaded to your main repository folder.");
                });
            } else {
                music.pause();
                musicBtn.innerText = "🎵 Play Ambient Music";
                controls.style.display = "none";
            }
        }

        function adjustVolume(val) {
            music.volume = val;
        }
    </script>
    <script src="https://www.biblegateway.com/votd/get/?format=json&version=NIV&callback=votdCallback"></script>

</body>
</html>
