<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Scripture</title>
    <!-- Google Fonts for Stained Glass / Sacred Aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            /* Cathedral Stained Glass Background */
            background: 
                radial-gradient(circle at center, rgba(15, 23, 42, 0.35) 0%, rgba(15, 23, 42, 0.75) 100%),
                url('background.jpg') center/cover no-repeat fixed;
            background-color: #0b0f19;
            color: #f8fafc;
        }

        /* Frosted Stained Glass Card */
        .card {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 32px;
            padding: 44px 32px 36px 32px;
            max-width: 460px;
            width: 100%;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 2px rgba(255, 255, 255, 0.25);
            text-align: center;
            position: relative;
        }

        /* Top Accent Tag */
        .tag {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
            color: #38bdf8;
            font-weight: 700;
            margin-bottom: 28px;
            text-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
        }

        /* Verse Text Styling */
        .bg-votd-text {
            font-size: 1.55rem;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 20px;
            font-style: italic;
            font-weight: 500;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* Verse Reference Styling */
        .bg-votd-title {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fde047;
            margin-bottom: 24px;
            letter-spacing: 1px;
            text-shadow: 0 0 14px rgba(253, 224, 71, 0.5);
        }

        .section-divider {
            margin: 28px 0;
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        }

        /* Interactive Interface Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            font-family: 'Cinzel', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 0.88rem;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .btn-primary:hover, .btn-primary:active {
            background: rgba(255, 255, 255, 0.28);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }

        .btn-music {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(168, 85, 247, 0.25));
            color: #ffffff;
            border: 1px solid rgba(125, 211, 252, 0.45);
        }

        .btn-music:hover, .btn-music:active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.4), rgba(168, 85, 247, 0.4));
            border-color: rgba(125, 211, 252, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(56, 189, 248, 0.25);
        }

        /* Audio Controls Bar */
        .audio-controls {
            margin-top: 18px;
            display: none;
            gap: 12px;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .audio-controls span {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            color: #cbd5e1;
            letter-spacing: 1px;
        }

        .audio-controls input[type=range] {
            accent-color: #38bdf8;
            width: 130px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="tag">✦ Verse of the Day ✦</div>

        <div id="votd-box">
            <div class="bg-votd-text">"Trust in the LORD with all your heart and lean not on your own understanding."</div>
            <div class="bg-votd-title">— Proverbs 3:5</div>
        </div>

        <hr class="section-divider">

        <div class="btn-group">
            <a id="audio-link" href="https://www.biblegateway.com/audio/mclean/niv/Prov.3" target="_blank" class="btn btn-primary">
                🔊 Listen to Scripture
            </a>

            <button id="music-btn" class="btn btn-music" onclick="toggleMusic()">
                🎵 Play Ambient Music
            </button>
        </div>

        <div id="audio-controls" class="audio-controls">
            <span>Volume</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" onchange="adjustVolume(this.value)">
        </div>

        <audio id="bg-music" loop preload="auto">
            <source src="music.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        function votdCallback(votd) {
            var verseText = votd.text || votd.content;
            var verseRef = votd.reference || votd.display_ref;

            if (verseText && verseRef) {
                document.getElementById('votd-box').innerHTML = 
                    '<div class="bg-votd-text">' + verseText + '</div>' +
                    '<div class="bg-votd-title">— ' + verseRef + '</div>';

                var cleanRef = encodeURIComponent(verseRef);
                document.getElementById('audio-link').href = "https://www.biblegateway.com/passage/?search=" + cleanRef + "&version=NIV";
            }
        }

        var music = document.getElementById("bg-music");
        var musicBtn = document.getElementById("music-btn");
        var controls = document.getElementById("audio-controls");

        function toggleMusic() {
            if (music.paused) {
                music.play().then(function() {
                    musicBtn.innerHTML = "⏸ Pause Ambient Music";
                    controls.style.display = "flex";
                }).catch(function(e) {
                    alert("Ensure 'music.mp3' is uploaded to your main repository folder.");
                });
            } else {
                music.pause();
                musicBtn.innerHTML = "🎵 Play Ambient Music";
                controls.style.display = "none";
            }
        }

        function adjustVolume(val) {
            music.volume = val;
        }
    </script>
    <script src="https://www.biblegateway.com/votd/get/?format=json&version=NIV&callback=votdCallback"></script>

</body>
</html>
