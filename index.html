<html lang="en">
<head>

    <title>Daily Scripture</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 36px 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .tag {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .verse-text {
            font-size: 1.25rem;
            line-height: 1.7;
            color: #f8fafc;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .verse-ref {
            font-size: 1rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .audio-container {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .audio-btn {
            display: inline-block;
            width: 100%;
            background: #38bdf8;
            color: #0f172a;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .audio-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>

        <div class="audio-container">

                🔊 Listen to Audio Bible
            </a>
        </div>
    </div>
