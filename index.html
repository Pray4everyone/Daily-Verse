<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Scripture</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 36px 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .tag {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .bg-votd-text {
            font-size: 1.25rem;
            line-height: 1.7;
            color: #f8fafc;
            margin-bottom: 16px;
            font-style: italic;
        }

        .bg-votd-title {
            font-size: 1rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 24px;
        }

        .bg-votd-copyright {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 15px;
        }

        .bg-votd-copyright a {
            color: #64748b;
            text-decoration: none;
        }

        .audio-container {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .audio-btn {
            display: inline-block;
            width: 100%;
            background: #38bdf8;
            color: #0f172a;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="tag">✦ Verse of the Day ✦</div>

        <div id="votd-box">Loading today's verse...</div>

        <div class="audio-container">
            <a id="audio-link" href="https://www.biblegateway.com/audio/mclean/niv/Gen.1" target="_blank" class="audio-btn">
                🔊 Listen to Audio Bible
            </a>
        </div>
    </div>

    <script>
        function votdCallback(votd) {
            var verseText = votd.text || votd.content || "Trust in the LORD with all your heart and lean not on your own understanding.";
            var verseRef = votd.reference || votd.display_ref || "Proverbs 3:5";
            var copyright = votd.copyright || "";

            document.getElementById('votd-box').innerHTML = 
                '<div class="bg-votd-text">' + verseText + '</div>' +
                '<div class="bg-votd-title">— ' + verseRef + '</div>' +
                (copyright ? '<div class="bg-votd-copyright">' + copyright + '</div>' : '');

            if (votd.reference) {
                var cleanRef = encodeURIComponent(votd.reference);
                document.getElementById('audio-link').href = "https://www.biblegateway.com/audio/mclean/niv/" + cleanRef;
            }
        }
    </script>
    <script src="https://www.biblegateway.com/votd/get/?format=json&version=NIV&callback=votdCallback"></script>

</body>
</html>
