<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Scripture</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Cormorant+Garamond:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background-color: #0f172a;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #000000;
            position: relative;
            transition: background-image 0.5s ease-in-out;
        }

        /* Top Right Control Bar */
        .top-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            z-index: 100;
        }

        /* Compact Top-Right Buttons */
        .btn-compact {
            font-family: 'Cinzel', serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.85);
            color: #000000;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            transition: all 0.2s ease;
        }

        .btn-compact:hover, .btn-compact:active {
            background: rgba(255, 255, 255, 0.98);
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        /* Center Main Container - No Box */
        .verse-container {
            max-width: 850px;
            width: 100%;
            text-align: center;
            padding: 20px;
            margin: auto;
        }

        /* Header Accent Label */
        .tag {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.9rem;
            color: #000000;
            font-weight: 800;
            margin-bottom: 24px;
            text-shadow: 
                0 0 12px rgba(255, 255, 255, 0.9),
                0 0 20px rgba(255, 255, 255, 0.7);
        }

        /* Extra Large Bold Black Verse Text */
        .bg-votd-text {
            font-size: 2.8rem;
            line-height: 1.4;
            color: #000000;
            margin-bottom: 24px;
            font-style: italic;
            font-weight: 700;
            text-shadow: 
                0 0 15px rgba(255, 255, 255, 0.95),
                0 0 30px rgba(255, 255, 255, 0.8),
                2px 2px 4px rgba(255, 255, 255, 0.9);
        }

        /* Extra Large Bold Reference */
        .bg-votd-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: #000000;
            letter-spacing: 2px;
            text-shadow: 
                0 0 12px rgba(255, 255, 255, 0.95),
                0 0 25px rgba(255, 255, 255, 0.8);
        }

        @media (max-width: 600px) {
            .bg-votd-text {
                font-size: 2.0rem;
            }
            .bg-votd-title {
                font-size: 1.4rem;
            }
            .top-controls {
                top: 12px;
                right: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Small Control Buttons Pinned Top-Right -->
    <div class="top-controls">
        <a id="audio-link" href="https://www.biblegateway.com/audio/mclean/niv/Prov.3" target="_blank" class="btn-compact">
            🔊 Scripture
        </a>

        <button id="music-btn" class="btn-compact" onclick="toggleMusic()">
            🎵 Music
        </button>

        <button class="btn-compact" onclick="changeSceneRandom()">
            🔀 Scene
        </button>
    </div>

    <!-- Main Borderless Verse Display -->
    <div class="verse-container">
        <div class="tag">✦ Verse of the Day ✦</div>

        <div id="votd-box">
            <div class="bg-votd-text">"Trust in the LORD with all your heart and lean not on your own understanding."</div>
            <div class="bg-votd-title">— Proverbs 3:5</div>
        </div>
    </div>

    <audio id="bg-music" loop preload="auto"></audio>

    <script>
        var TOTAL_ITEMS = 10; // Matches background1-10.jpg and music1-10.mp3
        var currentIndex = 1;
        var music = document.getElementById("bg-music");
        var musicBtn = document.getElementById("music-btn");
        var isMusicPlaying = false;

        // Automatically set background and matching music track based on day of year
        function setDailyScene() {
            var now = new Date();
            var start = new Date(now.getFullYear(), 0, 0);
            var diff = now - start;
            var oneDay = 1000 * 60 * 60 * 24;
            var dayOfYear = Math.floor(diff / oneDay);

            currentIndex = (dayOfYear % TOTAL_ITEMS) + 1;
            applyScene(currentIndex);
        }

        // Randomize both background and music track together
        function changeSceneRandom() {
            var newIndex;
            do {
                newIndex = Math.floor(Math.random() * TOTAL_ITEMS) + 1;
            } while (newIndex === currentIndex && TOTAL_ITEMS > 1);

            currentIndex = newIndex;
            applyScene(currentIndex);
        }

        // Apply image and update audio source
        function applyScene(index) {
            tryLoadingImage(index, 0);
            
            // Update music source to match the corresponding track number (music1.mp3, music2.mp3, etc.)
            music.src = "music" + index + ".mp3";
            music.load();

            if (isMusicPlaying) {
                music.play().catch(function(e) {
                    console.log("Autoplay prevented or track missing.");
                });
            }
        }

        function tryLoadingImage(index, extIndex) {
            var extensions = ['.jpg', '.jpeg', '.png'];
            if (extIndex >= extensions.length) return;

            var bgUrl = "background" + index + extensions[extIndex];
            var img = new Image();

            img.onload = function() {
                document.body.style.backgroundImage = 
                    "linear-gradient(rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.15)), url('" + bgUrl + "')";
            };

            img.onerror = function() {
                tryLoadingImage(index, extIndex + 1);
            };

            img.src = bgUrl;
        }

        setDailyScene();

        function toggleMusic() {
            if (music.paused) {
                music.play().then(function() {
                    isMusicPlaying = true;
                    musicBtn.innerHTML = "⏸ Music";
                }).catch(function(e) {
                    alert("Ensure 'music" + currentIndex + ".mp3' is uploaded to your repository root folder.");
                });
            } else {
                music.pause();
                isMusicPlaying = false;
                musicBtn.innerHTML = "🎵 Music";
            }
        }

        function votdCallback(votd) {
            var verseText = votd.text || votd.content;
            var verseRef = votd.reference || votd.display_ref;

            if (verseText && verseRef) {
                document.getElementById('votd-box').innerHTML = 
                    '<div class="bg-votd-text">' + verseText + '</div>' +
                    '<div class="bg-votd-title">— ' + verseRef + '</div>';

                var cleanRef = encodeURIComponent(verseRef);
                document.getElementById('audio-link').href = "https://www.biblegateway.com/passage/?search=" + cleanRef + "&version=NIV";
            }
        }
    </script>
    <script src="https://www.biblegateway.com/votd/get/?format=json&version=NIV&callback=votdCallback"></script>

</body>
</html>
