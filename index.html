<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Scripture</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 40px 20px;
            background-color: #0f172a;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            position: relative;
            transition: background-image 0.6s ease-in-out;
            overflow-x: hidden;
        }

        /* Top Horizontal Glass Navbar */
        .top-navbar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            z-index: 1000;
            max-width: 95vw;
            flex-wrap: wrap;
        }

        .btn-nav {
            font-family: 'Cinzel', serif;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 0.8px;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-nav:hover, .btn-nav:active {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-1px);
            color: #ffffff;
        }

        /* Frosted Dark Glass Card Container */
        .verse-card {
            max-width: 820px;
            width: 100%;
            text-align: center;
            padding: 48px 36px;
            margin: auto;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* Header Accent Label */
        .tag {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.85rem;
            color: #fef08a;
            font-weight: 800;
            margin-bottom: 24px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Large Ivory Verse Text */
        .bg-votd-text {
            font-size: 2.5rem;
            line-height: 1.45;
            color: #fffbeb;
            margin-bottom: 28px;
            font-style: italic;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
        }

        /* Large Ivory Reference Title */
        .bg-votd-title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #fef3c7;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
        }

        @media (max-width: 650px) {
            body {
                padding-top: 100px;
            }
            .verse-card {
                padding: 32px 20px;
            }
            .bg-votd-text {
                font-size: 1.85rem;
            }
            .bg-votd-title {
                font-size: 1.25rem;
            }
            .top-navbar {
                top: 10px;
                padding: 4px 8px;
                gap: 4px;
            }
            .btn-nav {
                font-size: 0.62rem;
                padding: 5px 9px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="top-navbar">
        <a id="audio-link" href="https://www.biblegateway.com/audio/mclean/niv/Prov.3" target="_blank" class="btn-nav">
            🔊 Scripture
        </a>

        <button id="music-btn" class="btn-nav" onclick="toggleMusic()">
            ▶ Play
        </button>

        <button class="btn-nav" onclick="nextTrack()">
            ⏭ Next Track
        </button>

        <button class="btn-nav" onclick="changeSceneRandom()">
            🔀 Scene
        </button>

        <a href="https://localchurches.org/" target="_blank" rel="noopener noreferrer" class="btn-nav">
            ⛪ Find A Church Near You
        </a>
    </nav>

    <!-- Main Scripture Card -->
    <main class="verse-card">
        <div class="tag">✦ Scripture for Your Path ✦</div>

        <div id="votd-box">
            <div class="bg-votd-text">"Trust in the LORD with all your heart and lean not on your own understanding."</div>
            <div class="bg-votd-title">— Proverbs 3:5</div>
        </div>
    </main>

    <audio id="bg-music" loop preload="auto"></audio>

    <script>
        var TOTAL_ITEMS = 10;
        var currentIndex = 1;
        var music = document.getElementById("bg-music");
        var musicBtn = document.getElementById("music-btn");
        var isMusicPlaying = false;

        function setDailyScene() {
            var now = new Date();
            var start = new Date(now.getFullYear(), 0, 0);
            var diff = now - start;
            var oneDay = 1000 * 60 * 60 * 24;
            var dayOfYear = Math.floor(diff / oneDay);

            currentIndex = (dayOfYear % TOTAL_ITEMS) + 1;
            applyScene(currentIndex);
        }

        function changeSceneRandom() {
            var newIndex;
            do {
                newIndex = Math.floor(Math.random() * TOTAL_ITEMS) + 1;
            } while (newIndex === currentIndex && TOTAL_ITEMS > 1);

            currentIndex = newIndex;
            applyScene(currentIndex);
        }

        function applyScene(index) {
            tryLoadingImage(index, 0);
            
            music.src = "music" + index + ".mp3";
            music.load();

            if (isMusicPlaying) {
                music.play().catch(function(e) {
                    console.log("Autoplay waiting for user action.");
                });
            }
        }

        function tryLoadingImage(index, extIndex) {
            var extensions = ['.jpg', '.jpeg', '.png'];
            if (extIndex >= extensions.length) return;

            var bgUrl = "background" + index + extensions[extIndex];
            var img = new Image();

            img.onload = function() {
                document.body.style.backgroundImage = 
                    "linear-gradient(rgba(15, 23, 42, 0.35), rgba(15, 23, 42, 0.35)), url('" + bgUrl + "')";
            };

            img.onerror = function() {
                tryLoadingImage(index, extIndex + 1);
            };

            img.src = bgUrl;
        }

        function toggleMusic() {
            if (music.paused) {
                music.play().then(function() {
                    isMusicPlaying = true;
                    musicBtn.innerHTML = "⏸ Pause";
                }).catch(function(e) {
                    alert("Please ensure 'music" + currentIndex + ".mp3' is uploaded to your main repository folder.");
                });
            } else {
                music.pause();
                isMusicPlaying = false;
                musicBtn.innerHTML = "▶ Play";
            }
        }

        function nextTrack() {
            currentIndex = (currentIndex % TOTAL_ITEMS) + 1;
            music.src = "music" + currentIndex + ".mp3";
            music.load();
            if (isMusicPlaying || music.paused) {
                music.play().then(function() {
                    isMusicPlaying = true;
                    musicBtn.innerHTML = "⏸ Pause";
                }).catch(function(e) {
                    console.log("Track change requires user interaction.");
                });
            }
        }

        setDailyScene();

        // Autoplay attempt on load
        window.addEventListener('DOMContentLoaded', function() {
            var playPromise = music.play();
            if (playPromise !== undefined) {
                playPromise.then(function() {
                    isMusicPlaying = true;
                    musicBtn.innerHTML = "⏸ Pause";
                }).catch(function() {
                    isMusicPlaying = false;
                    musicBtn.innerHTML = "▶ Play";
                });
            }
        });

        function votdCallback(votd) {
            var verseText = votd.text || votd.content;
            var verseRef = votd.reference || votd.display_ref;

            if (verseText && verseRef) {
                document.getElementById('votd-box').innerHTML = 
                    '<div class="bg-votd-text">' + verseText + '</div>' +
                    '<div class="bg-votd-title">— ' + verseRef + '</div>';

                var cleanRef = encodeURIComponent(verseRef);
                document.getElementById('audio-link').href = "https://www.biblegateway.com/passage/?search=" + cleanRef + "&version=NIV";
            }
        }
    </script>
    <script src="https://www.biblegateway.com/votd/get/?format=json&version=NIV&callback=votdCallback"></script>

</body>
</html>
