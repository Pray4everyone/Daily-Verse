<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Verse</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px 24px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .header-tag {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Styling Bible Gateway Widget */
        .bg-votd-text {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #f1f5f9;
            margin-bottom: 16px;
            font-style: italic;
        }

        .bg-votd-title {
            font-size: 1rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 24px;
        }

        .bg-votd-copyright {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 15px;
        }

        .bg-votd-copyright a {
            color: #64748b;
            text-decoration: none;
        }

        /* Buttons & Audio Options */
        .audio-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn {
            display: inline-block;
            width: 100%;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-tag">Daily Scripture</div>

        <!-- Bible Gateway Automated Verse Widget -->
        <script src="https://www.biblegateway.com/votd/get/?format=json&version=NIV&callback=BG.votdCallback"></script>
        <script>
            function votdCallback(votd) {
                document.write('<div class="bg-votd-text">' + votd.content + '</div>');
                document.write('<div class="bg-votd-title">— ' + votd.reference + '</div>');
                document.write('<div class="bg-votd-copyright">' + votd.copyright + '</div>');
            }
        </script>
        <script src="https://www.biblegateway.com/votd/get/?format=json&version=NIV&callback=votdCallback"></script>

        <div class="audio-section">
            <a href="https://www.biblegateway.com/audio/mclean/niv/Gen.1" target="_blank" class="btn">
                🎧 Listen to Audio Bible
            </a>
        </div>
    </div>

</body>
</html>
