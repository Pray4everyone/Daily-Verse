<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Scripture</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 40px 20px;
            background-color: #0f172a;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            position: relative;
            transition: background-image 0.6s ease-in-out;
            overflow-x: hidden;
        }

        /* Top Left Glass Streak Badge */
        .top-left-streak {
            position: fixed;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            z-index: 1000;
        }

        .streak-count-text {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            color: #fef08a;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            cursor: pointer;
        }

        /* Top Right Menu Container */
        .top-menu-container {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
        }

        .menu-toggle-btn {
            font-family: 'Cinzel', serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.8px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #f8fafc;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            transition: all 0.2s ease;
        }

        .menu-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Dropdown Content Box */
        .dropdown-menu {
            position: absolute;
            top: 42px;
            right: 0;
            width: 230px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            padding: 8px;
            gap: 4px;
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-item {
            font-family: 'Cinzel', serif;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 0.8px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #f8fafc;
            text-align: left;
            transition: background 0.2s ease;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        /* Frosted Dark Glass Card Container */
        .verse-card {
            max-width: 820px;
            width: 100%;
            text-align: center;
            padding: 48px 36px;
            margin: auto;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Bookmark Button on Card */
        .bookmark-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fef08a;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .bookmark-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        /* Header Accent Label */
        .tag {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.85rem;
            color: #fef08a;
            font-weight: 800;
            margin-bottom: 24px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Large Ivory Verse Text */
        .bg-votd-text {
            font-size: 2.5rem;
            line-height: 1.45;
            color: #fffbeb;
            margin-bottom: 28px;
            font-style: italic;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
        }

        /* Large Ivory Reference Title */
        .bg-votd-title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #fef3c7;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
        }

        /* Modals for Saved Verses & Milestones */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-card {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            color: #f8fafc;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fef08a;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-modal {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .badge-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .badge-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .badge-item.unlocked {
            border-color: #fef08a;
            background: rgba(254, 240, 138, 0.08);
            color: #fef08a;
        }

        @media (max-width: 650px) {
            body {
                padding-top: 110px;
            }
            .verse-card {
                padding: 32px 20px;
            }
            .bg-votd-text {
                font-size: 1.85rem;
            }
            .bg-votd-title {
                font-size: 1.25rem;
            }
            .top-left-streak {
                top: 10px;
                left: 10px;
                padding: 5px 10px;
            }
            .top-menu-container {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Left Glass Streak Badge -->
    <div class="top-left-streak" onclick="openMilestones()">
        <span id="streak-display" class="streak-count-text">🔥 1 Day Streak</span>
    </div>

    <!-- Top Right Compact Dropdown Menu -->
    <div class="top-menu-container">
        <button class="menu-toggle-btn" onclick="toggleMenu()">
            ☰ Menu
        </button>
        <div id="dropdown-menu" class="dropdown-menu">
            <a id="audio-link" href="https://www.biblegateway.com/audio/mclean/niv/Prov.3" target="_blank" class="dropdown-item">
                🔊 Scripture Audio
            </a>
            <button id="music-btn" class="dropdown-item" onclick="toggleMusic()">
                ⏸ Pause Music
            </button>
            <button class="dropdown-item" onclick="nextTrack()">
                ⏭ Next Track
            </button>
            <button class="dropdown-item" onclick="changeSceneRandom()">
                🔀 Shuffle Scene
            </button>
            <button class="dropdown-item" onclick="saveCurrentVerse()">
                ⭐ Save to Favorites
            </button>
            <button class="dropdown-item" onclick="shareCurrentVerse()">
                🔗 Share Verse
            </button>
            <button class="dropdown-item" onclick="openSavedVerses()">
                📖 View Favorites
            </button>
            <button class="dropdown-item" onclick="openMilestones()">
                🏆 Streak Badges
            </button>
            <a href="https://localchurches.org/" target="_blank" rel="noopener noreferrer" class="dropdown-item">
                ⛪ Find A Church
            </a>
        </div>
    </div>

    <!-- Main Scripture Card -->
    <main class="verse-card">
        <button class="bookmark-btn" onclick="saveCurrentVerse()" title="Save to Favorites">⭐</button>
        <div class="tag">✦ Scripture for Your Path ✦</div>

        <div id="votd-box">
            <div class="bg-votd-text" id="verse-text">"Trust in the LORD with all your heart and lean not on your own understanding."</div>
            <div class="bg-votd-title" id="verse-ref">— Proverbs 3:5</div>
        </div>
    </main>

    <!-- Saved Verses Modal -->
    <div id="saved-modal" class="modal-overlay" onclick="closeModals(event)">
        <div class="modal-card">
            <div class="modal-header">
                <span>📖 Favorite Verses</span>
                <button class="close-modal" onclick="closeModals()">✕</button>
            </div>
            <div id="saved-verses-list" style="font-size: 0.95rem; line-height: 1.5; color: #fffbeb;">
                <p style="opacity: 0.7;">No saved verses yet. Click the star icon or menu option to save daily verses here!</p>
            </div>
        </div>
    </div>

    <!-- Milestone Badges Modal -->
    <div id="milestone-modal" class="modal-overlay" onclick="closeModals(event)">
        <div class="modal-card">
            <div class="modal-header">
                <span>🏆 Streak Milestones</span>
                <button class="close-modal" onclick="closeModals()">✕</button>
            </div>
            <div class="badge-grid" id="badge-container">
                <!-- Populated via JS -->
            </div>
        </div>
    </div>

    <audio id="bg-music" loop preload="auto"></audio>

    <script>
        var TOTAL_ITEMS = 10;
        var currentMusicIndex = 1;
        var currentImageIndex = 1;
        var music = document.getElementById("bg-music");
        var musicBtn = document.getElementById("music-btn");
        var currentStreakCount = 1;

        // Toggle Dropdown Menu
        function toggleMenu() {
            document.getElementById("dropdown-menu").classList.toggle("show");
        }

        window.onclick = function(event) {
            if (!event.target.matches('.menu-toggle-btn') && !event.target.closest('.dropdown-menu')) {
                var dropdowns = document.getElementsByClassName("dropdown-menu");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        // --- STREAK COUNTER LOGIC ---
        function updateDailyStreak() {
            var today = new Date();
            var todayStr = today.getFullYear() + '-' + (today.getMonth() + 1) + '-' + today.getDate();

            var lastVisitStr = localStorage.getItem("last_verse_visit_date");
            var currentStreak = parseInt(localStorage.getItem("verse_streak_count") || "0", 10);

            if (!lastVisitStr) {
                currentStreak = 1;
            } else if (lastVisitStr === todayStr) {
                if (currentStreak === 0) currentStreak = 1;
            } else {
                var lastVisitDate = new Date(lastVisitStr);
                var todayDate = new Date(todayStr);
                
                var timeDiff = todayDate.getTime() - lastVisitDate.getTime();
                var dayDiff = Math.round(timeDiff / (1000 * 3600 * 24));

                if (dayDiff === 1) {
                    currentStreak += 1;
                } else if (dayDiff > 1) {
                    currentStreak = 1;
                }
            }

            localStorage.setItem("last_verse_visit_date", todayStr);
            localStorage.setItem("verse_streak_count", currentStreak.toString());
            currentStreakCount = currentStreak;

            document.getElementById("streak-display").innerText = "🔥 " + currentStreak + (currentStreak === 1 ? " Day Streak" : " Days Streak");
        }

        // --- RANDOM EXPERIENCE ON LOAD ---
        function initRandomExperience() {
            currentMusicIndex = Math.floor(Math.random() * TOTAL_ITEMS) + 1;
            currentImageIndex = Math.floor(Math.random() * TOTAL_ITEMS) + 1;

            tryLoadingImage(currentImageIndex, 0);

            music.src = "music" + currentMusicIndex + ".mp3";
            music.load();

            var playPromise = music.play();
            if (playPromise !== undefined) {
                playPromise.then(function() {
                    musicBtn.innerHTML = "⏸ Pause Music";
                }).catch(function(e) {
                    musicBtn.innerHTML = "▶ Play Music";
                });
            }
        }

        // Independent Image Shuffler
        function changeSceneRandom() {
            var newImageIndex;
            do {
                newImageIndex = Math.floor(Math.random() * TOTAL_ITEMS) + 1;
            } while (newImageIndex === currentImageIndex && TOTAL_ITEMS > 1);

            currentImageIndex = newImageIndex;
            tryLoadingImage(currentImageIndex, 0);
        }

        function tryLoadingImage(index, extIndex) {
            var extensions = ['.jpg', '.jpeg', '.png'];
            if (extIndex >= extensions.length) return;

            var bgUrl = "background" + index + extensions[extIndex];
            var img = new Image();

            img.onload = function() {
                document.body.style.backgroundImage = 
                    "linear-gradient(rgba(15, 23, 42, 0.35), rgba(15, 23, 42, 0.35)), url('" + bgUrl + "')";
            };

            img.onerror = function() {
                tryLoadingImage(index, extIndex + 1);
            };

            img.src = bgUrl;
        }

        function toggleMusic() {
            if (music.paused) {
                music.play().then(function() {
                    musicBtn.innerHTML = "⏸ Pause Music";
                }).catch(function(e) {
                    alert("Please ensure 'music" + currentMusicIndex + ".mp3' is uploaded to your GitHub repository.");
                });
            } else {
                music.pause();
                musicBtn.innerHTML = "▶ Play Music";
            }
        }

        // Independent Music Track Advancer
        function nextTrack() {
            currentMusicIndex = (currentMusicIndex % TOTAL_ITEMS) + 1;
            music.src = "music" + currentMusicIndex + ".mp3";
            music.load();
            music.play().then(function() {
                musicBtn.innerHTML = "⏸ Pause Music";
            }).catch(function(e) {
                musicBtn.innerHTML = "▶ Play Music";
            });
        }

        // --- SHARE & COPY VERSE ---
        function shareCurrentVerse() {
            var text = document.getElementById("verse-text").innerText;
            var ref = document.getElementById("verse-ref").innerText;
            var shareText = text + " " + ref + " (Shared via Daily Scripture)";

            if (navigator.share) {
                navigator.share({
                    title: 'Daily Scripture',
                    text: shareText,
                    url: window.location.href
                }).catch(function(err) {
                    console.log("Share canceled or failed", err);
                });
            } else {
                navigator.clipboard.writeText(shareText).then(function() {
                    alert("Verse copied to clipboard! You can now paste and share it anywhere.");
                }).catch(function() {
                    alert("Unable to copy text automatically.");
                });
            }
        }

        // --- FAVORITE VERSES & BOOKMARKS ---
        function saveCurrentVerse() {
            var text = document.getElementById("verse-text").innerText;
            var ref = document.getElementById("verse-ref").innerText;
            var saved = JSON.parse(localStorage.getItem("favorite_verses") || "[]");

            var exists = saved.some(function(v) { return v.ref === ref; });
            if (!exists) {
                saved.push({ text: text, ref: ref });
                localStorage.setItem("favorite_verses", JSON.stringify(saved));
                alert("Verse saved to your favorites!");
            } else {
                alert("
