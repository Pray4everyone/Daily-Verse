<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Scripture</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            /* Stained Glass Multi-Color Gradient Backdrop */
            background: 
                radial-gradient(circle at 20% 20%, rgba(147, 51, 234, 0.6) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(239, 68, 68, 0.6) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(59, 130, 246, 0.6) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(234, 179, 8, 0.5) 0%, transparent 50%),
                linear-gradient(135deg, #090d16, #111827);
            background-attachment: fixed;
            color: #f8fafc;
        }

        /* Frosted Glassmorphism Card */
        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            padding: 36px 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        .tag {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            color: #7dd3fc;
            font-weight: 700;
            margin-bottom: 24px;
            text-shadow: 0 0 12px rgba(125, 211, 252, 0.5);
        }

        .bg-votd-text {
            font-size: 1.25rem;
            line-height: 1.7;
            color: #ffffff;
            margin-bottom: 16px;
            font-style: italic;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .bg-votd-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fde047;
            margin-bottom: 24px;
            text-shadow: 0 0 10px rgba(253, 224, 71, 0.4);
        }

        .bg-votd-copyright {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 15px;
        }

        .bg-votd-copyright a {
            color: #94a3b8;
            text-decoration: none;
        }

        .section-divider {
            margin: 24px 0;
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        /* Action Buttons */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
        }

        .btn-primary:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.35);
        }

        .btn-music {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(59, 130, 246, 0.4));
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-music:active {
            transform: scale(0.98);
        }

        .audio-controls {
            margin-top: 10px;
            display: none;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .audio-controls input[type=range] {
            accent-color: #fde047;
            width: 100px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="tag">✦ Verse of the Day ✦</div>

        <div id="votd-box">Loading today's verse...</div>

        <hr class="section-divider">

        <!-- Direct Audio Bible Link -->
        <a id="audio-link" href="https://www.biblegateway.com/audio/mclean/niv/Gen.1" target="_blank" class="btn btn-primary">
            🔊 Listen to Audio Scripture
        </a>

        <!-- Ambient Background Music Player -->
        <button id="music-btn" class="btn btn-music" onclick="toggleMusic()">
            🎵 Play Ambient Music
        </button>

        <div id="audio-controls" class="audio-controls">
            <span style="font-size: 0.8rem; color: #cbd5e1;">Vol:</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" onchange="adjustVolume(this.value)">
        </div>

        <audio id="bg-music" loop preload="auto">
            <source src="https://www.fesliyanstudios.com/musicfiles/2019-06-25_-_Heaven_-_David_Fesliyan.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        // Daily Verse Callback Handler
        function votdCallback(votd) {
            var verseText = votd.text || votd.content || "Trust in the LORD with all your heart and lean not on your own understanding.";
            var verseRef = votd.reference || votd.display_ref || "Proverbs 3:5";
            var copyright = votd.copyright || "";

            document.getElementById('votd-box').innerHTML = 
                '<div class="bg-votd-text">' + verseText + '</div>' +
                '<div class="bg-votd-title">— ' + verseRef + '</div>' +
                (copyright ? '<div class="bg-votd-copyright">' + copyright + '</div>' : '');

            if (votd.reference) {
                var cleanRef = encodeURIComponent(votd.reference);
                document.getElementById('audio-link').href = "https://www.biblegateway.com/audio/mclean/niv/" + cleanRef;
            }
        }

        // Background Music Logic
        var music = document.getElementById("bg-music");
        var musicBtn = document.getElementById("music-btn");
        var controls = document.getElementById("audio-controls");

        function toggleMusic() {
            if (music.paused) {
                music.play();
                musicBtn.innerText = "⏸ Pause Ambient Music";
                controls.style.display = "flex";
            } else {
                music.pause();
                musicBtn.innerText = "🎵 Play Ambient Music";
                controls.style.display = "none";
            }
        }

        function adjustVolume(val) {
            music.volume = val;
        }
    </script>
    <script src="https://www.biblegateway.com/votd/get/?format=json&version=NIV&callback=votdCallback"></script>

</body>
</html>
